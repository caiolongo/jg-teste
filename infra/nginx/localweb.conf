# Demo UI (profile `localweb`). Same origin for page and API, so the backend needs no CORS.

# Docker's embedded DNS: `app` resolves to every replica, re-resolved so restarted replicas are picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app_replicas {
  # Shared memory: one round-robin across all nginx workers (without it, each worker rotates on its own
  # and consecutive requests that land on different workers all pick the same replica).
  zone app_replicas 64k;
  server app:3000 resolve;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://app_replicas/;
    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $request_id;
  }
}
